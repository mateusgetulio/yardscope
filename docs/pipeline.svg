<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#f7f6f2"/>
  <text x="80" y="90" font-size="40" font-weight="600" fill="#1c1917">From yard photos to a bookable job scope</text>
  <text x="80" y="130" font-size="22" fill="#57534e">One sentence plus two to four photos in; a typed, evidence-backed scope with a deterministic readiness gate and a synthetic price out.</text>

  <g id="stage1">
    <rect x="80" y="220" width="260" height="170" rx="16" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
    <text x="104" y="262" font-size="22" font-weight="600" fill="#1c1917">1. Request</text>
    <text x="104" y="298" font-size="18" fill="#44403c">Sentence + 2 to 4 photos</text>
    <text x="104" y="326" font-size="18" fill="#44403c">Metadata dropped, upright</text>
    <text x="104" y="354" font-size="18" fill="#44403c">Simulated property profile</text>
  </g>
  <path d="M340 305 L380 305" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>

  <g id="stage2">
    <rect x="384" y="220" width="260" height="170" rx="16" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
    <text x="408" y="262" font-size="22" font-weight="600" fill="#1c1917">2. Observation</text>
    <text x="408" y="298" font-size="18" fill="#44403c">Vision model, strict schema</text>
    <text x="408" y="326" font-size="18" fill="#44403c">Reports only: lines, evidence,</text>
    <text x="408" y="354" font-size="18" fill="#44403c">views, access, hazards, doubts</text>
  </g>
  <path d="M644 305 L684 305" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>

  <g id="stage3">
    <rect x="688" y="220" width="260" height="170" rx="16" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
    <text x="712" y="262" font-size="22" font-weight="600" fill="#1c1917">3. Readiness gate</text>
    <text x="712" y="298" font-size="18" fill="#44403c">Deterministic rules R1 to R6</text>
    <text x="712" y="326" font-size="18" fill="#44403c">Per line: priceable, needs photo,</text>
    <text x="712" y="354" font-size="18" fill="#44403c">pro quote, suggested, rejected</text>
  </g>
  <path d="M948 305 L988 305" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>

  <g id="stage4">
    <rect x="992" y="220" width="260" height="170" rx="16" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
    <text x="1016" y="262" font-size="22" font-weight="600" fill="#1c1917">4. Price and correct</text>
    <text x="1016" y="298" font-size="18" fill="#44403c">Synthetic rate card, priced lines</text>
    <text x="1016" y="326" font-size="18" fill="#44403c">Customer corrections re-gated,</text>
    <text x="1016" y="354" font-size="18" fill="#44403c">every value keeps its origin</text>
  </g>
  <path d="M1252 305 L1292 305" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>

  <g id="stage5">
    <rect x="1296" y="220" width="224" height="170" rx="16" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
    <text x="1320" y="262" font-size="22" font-weight="600" fill="#1c1917">5. Book, brief</text>
    <text x="1320" y="298" font-size="18" fill="#44403c">Book priced work</text>
    <text x="1320" y="326" font-size="18" fill="#44403c">Pro brief built from</text>
    <text x="1320" y="354" font-size="18" fill="#44403c">the scope alone</text>
  </g>

  <g id="loop">
    <path d="M818 390 L818 460 L232 460 L232 396" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowAmber)"/>
    <text x="260" y="490" font-size="18" fill="#b45309">Needs photos: the customer adds one, the analysis runs again, corrections carry over</text>
  </g>

  <g id="tested">
    <rect x="80" y="540" width="1440" height="250" rx="16" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
    <text x="104" y="584" font-size="22" font-weight="600" fill="#1c1917">What is tested, and how</text>
    <text x="104" y="626" font-size="18" fill="#44403c">Domain (no framework): nine invariants over 1,500 seeded random scopes, each readiness rule, the roll-up, pricing, corrections, the pro brief.</text>
    <text x="104" y="658" font-size="18" fill="#44403c">Feature tests drive the whole flow through recorded model answers keyed by photo bytes, so CI runs without any model.</text>
    <text x="104" y="690" font-size="18" fill="#44403c">The model itself is measured by evals over labeled photo sets: precision, recall, counts, hallucinated lines, dispositions, readiness.</text>
    <text x="104" y="722" font-size="18" fill="#44403c">Extraction drivers: recorded fixtures (default), the AI SDK with an API key, or the local Claude Code session for development.</text>
    <text x="104" y="762" font-size="16" fill="#78716c">Rates are synthetic. The model never prices, measures areas or decides readiness; it only reports what the photos show, with evidence per photo.</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#a8a29e"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="6" refY="10" orient="auto">
      <path d="M2 2 L10 2 L6 10 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
